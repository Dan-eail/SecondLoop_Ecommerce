version: '3.8'
services:
  mongodb:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/tena_marketplace
      JWT_SECRET: change-this-in-production
      JWT_REFRESH_SECRET: change-refresh-secret-in-production
      JWT_EXPIRE: 7d
      JWT_REFRESH_EXPIRE: 30d
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    volumes:
      - ./backend/logs:/app/logs

  seed:
    build: ./backend
    restart: "no"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/tena_marketplace
    depends_on:
      - mongodb
    command: ["node", "src/seeders/runAll.js"]

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
